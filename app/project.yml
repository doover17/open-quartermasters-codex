# XcodeGen spec for the Codex app: `xcodegen generate` creates Codex.xcodeproj.
name: Codex
options:
  bundleIdPrefix: org.openquartermaster
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  CodexKit:
    path: .
targets:
  Codex:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Codex
    dependencies:
      - package: CodexKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openquartermaster.codex
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Codex
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        SWIFT_VERSION: "5.9"
    scheme:
      testTargets:
        - package: CodexKit/CodexKitTests
